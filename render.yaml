services:
  - type: web
    name: event-management-backend
    env: node
    plan: starter
    region: oregon
    branch: main
    repo: https://github.com/vijayavinashchekkapalli/Event-management-frontend.git
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        value: mongodb+srv://<username>:<password>@<cluster-host>/<database>?retryWrites=true&w=majority
      - key: JWT_SECRET
        value: replace-with-strong-secret
      - key: EMAIL_USER
        value: startinnosolutions@gmail.com
      - key: EMAIL_PASS
        value: replace-with-email-app-password
      - key: SMTP_USER
        value: startinnosolutions@gmail.com
      - key: SMTP_PASS
        value: replace-with-brevo-smtp-pass
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: MAIL_PROVIDER
        value: brevo
      - key: BREVO_SMTP_USER
        value: startinnosolutions@gmail.com
      - key: BREVO_SMTP_PASS
        value: replace-with-brevo-smtp-pass
      - key: MAIL_FROM
        value: startinnosolutions@gmail.com
      - key: MAIL_FROM_NAME
        value: StartInno Solutions
      - key: CLOUDINARY_CLOUD_NAME
        value: replace-with-cloudinary-cloud-name
      - key: CLOUDINARY_API_KEY
        value: replace-with-cloudinary-api-key
      - key: CLOUDINARY_API_SECRET
        value: replace-with-cloudinary-api-secret
      - key: FRONTEND_URL
        value: https://startinno-registration-1.onrender.com
      - key: CORS_ORIGIN
        value: https://startinno-registration-1.onrender.com
